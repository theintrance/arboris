[project]
name = "arboris-dev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py310"
unsafe-fixes = false
lint.select = ["E","F","W","I","PL"]
lint.ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["arboris"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[dependency-groups]
dev = [
    "cpplint>=2.0.2",
    "mypy>=1.17.1",
    "ruff>=0.12.11",
]
test = [
    "pytest>=8",
]
bench = [
    "numpy>=1.25",
    "scipy>=1.10",
]
