# The Python package. The distribution is "pyarboris" (PyPI already has an unrelated
# "arboris"); the import name is arboris. scikit-build-core drives the CMake build below
# with ARBORIS_PYTHON=ON and ships only the extension module, not the C++ library.
[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "pyarboris"
version = "0.1.0"
description = "A fast HTML parser with a queryable DOM: CSS selectors, attributes, text, outer/inner HTML."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: HTML",
]

[project.urls]
Homepage = "https://github.com/theintrance/arboris"
Issues = "https://github.com/theintrance/arboris/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/arboris"]
install.components = ["python"]
sdist.exclude = ["benchmark/", "tests/", ".github/", "assets/", "hooks/", "scripts/", "docs/"]

[tool.scikit-build.cmake.define]
ARBORIS_PYTHON = "ON"
NO_TESTS = "ON"
ARBORIS_BENCHMARK = "OFF"
CMAKE_BUILD_TYPE = "Release"

# uv installs the package editable; these make it rebuild when the C++ changes.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "src/**/*" },
    { file = "python/**/*" },
]

[tool.ruff]
line-length = 100
extend-exclude = [".claude"]
target-version = "py310"
unsafe-fixes = false
lint.select = ["E","F","W","I","PL"]
lint.ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["arboris"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[dependency-groups]
dev = [
    "cpplint>=2.0.2",
    "mypy>=1.17.1",
    "ruff>=0.12.11",
]
test = [
    "pytest>=8",
]
build = [
    "cibuildwheel>=2.21",
]
bench = [
    "numpy>=1.25",
    "scipy>=1.10",
]
